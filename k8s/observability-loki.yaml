# Loki: log database. Single binary on the ops node; long-term data in the
# Oracle bucket "chat-logs" (S3-compatible). Tuned for few API requests.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: loki
  namespace: kube-system
spec:
  repo: https://grafana-community.github.io/helm-charts
  chart: loki
  targetNamespace: observability
  valuesContent: |-
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: chat-logs
          ruler: chat-logs
          admin: chat-logs
        s3:
          endpoint: axmmbljjebqv.compat.objectstorage.il-jerusalem-1.oraclecloud.com
          region: il-jerusalem-1
          accessKeyId: ${AWS_ACCESS_KEY_ID}
          secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
          s3ForcePathStyle: true
          insecure: false
      limits_config:
        retention_period: 168h        # keep logs 7 days
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        ingestion_rate_mb: 4          # one noisy pod can't flood storage
        ingestion_burst_size_mb: 8
      compactor:
        retention_enabled: true
        delete_request_store: s3
        compaction_interval: 2h       # fewer object-storage requests
      ingester:
        chunk_idle_period: 1h         # upload bigger chunks, less often
        max_chunk_age: 2h
        chunk_target_size: 1572864
      analytics:
        reporting_enabled: false
    singleBinary:
      replicas: 1
      nodeSelector:
        role: ops
      # The chart already passes -config.expand-env=true, which fills ${AWS_...} from this secret:
      extraEnvFrom:
        - secretRef:
            name: object-storage-credentials
      persistence:
        enabled: true
        size: 5Gi                     # write-ahead log + cache only
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    # Not needed for a single small instance:
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    minio:
      enabled: false
