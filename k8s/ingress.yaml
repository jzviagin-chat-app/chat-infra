apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat
spec:
  ingressClassName: haproxy
  rules:
    - http:
        paths:
          # The most specific prefix wins: /auth/... goes to auth, everything else to chat.
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat
                port:
                  number: 8000
