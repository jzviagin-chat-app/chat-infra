apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat
  annotations:
    # cert-manager sees this and creates the certificate for the host below.
    cert-manager.io/cluster-issuer: letsencrypt
    # http:// redirects to https:// (the certificate challenge on port 80 still works).
    haproxy.org/ssl-redirect: "true"
    haproxy.org/ssl-redirect-port: "443"
    # Coarse per-IP limit for all traffic: stops one machine hammering any service, before it
    # reaches the apps. Generous on purpose: mobile carriers put many users behind one shared IP
    # (carrier-grade NAT). Business limits (per phone, per IP per hour, daily SMS cap) live in
    # auth-service. A WebSocket connection counts once (its upgrade request), not per message.
    haproxy.org/rate-limit-requests: "200"
    haproxy.org/rate-limit-period: "10s"
    haproxy.org/rate-limit-status-code: "429"
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - jzviagin-chat-app.129-159-150-34.sslip.io
      secretName: public-tls
  rules:
    - host: jzviagin-chat-app.129-159-150-34.sslip.io
      http:
        paths:
          # The most specific prefix wins: /auth/... goes to auth, everything else to chat.
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat
                port:
                  number: 8000
