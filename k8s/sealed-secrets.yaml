# Sealed Secrets controller: decrypts SealedSecrets from git into normal Kubernetes Secrets.
# Its private key never leaves the cluster (back it up once: see docs/SECRETS.md).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  repo: https://bitnami-labs.github.io/sealed-secrets
  chart: sealed-secrets
  targetNamespace: kube-system
  valuesContent: |-
    # The name kubeseal expects by default.
    fullnameOverride: sealed-secrets-controller
    # One key forever (no 30-day rotation), so a single backup stays valid.
    keyrenewperiod: "0"
    nodeSelector:
      role: lb
