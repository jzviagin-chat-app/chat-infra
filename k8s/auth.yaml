apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      nodeSelector:
        role: worker # stateless, like chat: runs on the workers
      topologySpreadConstraints: # one per worker VM where possible
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth
      # Runs before the app on every pod start: applies new database migrations (Alembic).
      # Safe with several pods at once (advisory lock in alembic/env.py); a no-op when up to date.
      # If it fails, the new pod never starts and the old pods keep serving.
      initContainers:
        - name: migrate
          # Must be the same image as the app below. The auth-service pipeline bumps both tags.
          image: ghcr.io/jzviagin-chat-app/auth-service:sha-34501c5adcae
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-db # sealed in auth-db-sealed.yaml
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: auth
          # The tag is bumped automatically by a PR from the auth-service pipeline.
          image: ghcr.io/jzviagin-chat-app/auth-service:sha-34501c5adcae
          ports:
            - containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: DATABASE_URL
            - name: REDIS_URL # rate-limit counters; db 1 keeps them apart from chat's db 0
              value: redis://redis:6379/1
            - name: OTP_PEPPER # secret key for HMAC of SMS codes (only hashes are stored)
              valueFrom:
                secretKeyRef:
                  name: auth-otp # sealed in auth-otp-sealed.yaml
                  key: OTP_PEPPER
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth # other services reach it at http://auth:8000
spec:
  selector:
    app: auth
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: auth
