apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: haproxy-ingress
  namespace: kube-system
spec:
  repo: https://haproxytech.github.io/helm-charts
  chart: kubernetes-ingress
  targetNamespace: haproxy-controller
  createNamespace: true
  valuesContent: |-
    controller:
      replicaCount: 1
      nodeSelector:
        role: lb
      ingressClassResource:
        default: true
      service:
        type: LoadBalancer
        # Keep the client's real IP (otherwise k3s's ServiceLB rewrites it to 10.42.0.1 before HAProxy).
        # Safe here: HAProxy runs on the lb node, the only node ServiceLB uses.
        externalTrafficPolicy: Local
      config:
        load-balance: leastconn
        timeout-tunnel: 1h
