apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argo-cd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  targetNamespace: argocd
  createNamespace: true
  valuesContent: |-
    global:
      nodeSelector:
        role: lb
    dex:
      enabled: false
    notifications:
      enabled: false
    configs:
      params:
        server.insecure: true
